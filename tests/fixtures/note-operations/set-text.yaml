# Each case: a workspace document's text before, operations whose targets name notes by their text
# (or README.md for the document), then the text after or the refusal's code.

- name: a nested note's text changes, keeping its ID and children
  before: |
    - plan
        - step
            - id:: k3x9
            - detail
  operations:
    - {op: setText, target: "- step", text: "- [x] step done"}
  after: |
    - plan
        - [x] step done
            - id:: k3x9
            - detail

- name: the note takes canonical spelling and other notes keep theirs
  before: |
    * a
    * b
  operations:
    - {op: setText, target: "* a", text: "* a, edited"}
  after: |
    - a, edited
    * b

- name: replacements apply to the note's text
  before: |
    - buy milk
  operations:
    - op: setText
      target: "- buy milk"
      replacements: [{old: milk, new: bread}]
  after: |
    - buy bread

- name: notes named by temporary references change together
  before: |
    - a
    - b
  operations:
    - {op: setText, target: "- a", text: "- a2"}
    - {op: setText, target: "- b", text: "- b2"}
  after: |
    - a2
    - b2

- name: a temporary reference holds after an earlier operation moved notes
  before: |
    - a
    - b
  operations:
    - {op: setContent, target: README.md, content: "- x\n- a\n- b\n"}
    - {op: setText, target: "- b", text: "- b2"}
  after: |
    - x
    - a
    - b2

- name: a bullet becomes a number
  before: |
    - a
    - b
  operations:
    - {op: setText, target: "- a", text: 1. a}
  after: |
    1. a
    - b

- name: a numbered note keeps its place in its list when its number stays
  before: |
    1. a
    2. b
    3. c
  operations:
    - {op: setText, target: 2. b, text: 2. b edited}
  after: |
    1. a
    2. b edited
    3. c

- name: an indented top-level note's sibling stays beside it when the note changes
  before: |2
      * a
      * b
  operations:
    - {op: setText, target: "* a", text: "* a2"}
  after: |
    - a2
    * b

- name: a note named by its ID after the text returns to an earlier version
  before: |
    - a
    - k
        - id:: k1
  operations:
    - {op: ensureId, target: "- k"}
    - {op: setText, target: "- a", text: "- b"}
    - {op: setText, target: "- a", text: "- a"}
    - {op: setText, target: "- k", text: "- k2"}
  after: |
    - a
    - k2
        - id:: k1

- name: a nested note whose continuation line sits left of its marker stays under its parent
  before: |
    - a
        - b long
      cont
  operations:
    - op: setText
      target: "  - b long\ncont"
      replacements: [{old: cont, new: more}]
  after: |
    - a
      - b long more

- name: a heading's text changes, keeping what it contains
  before: |
    # Plan

    ## Week

    - step
  operations:
    - {op: setText, target: "## Week", text: "## Next week"}
  after: |
    # Plan

    ## Next week

    - step

- name: a heading level that would change what it contains is refused
  before: |
    # A

    ## B

    para

    ## C
  operations:
    - {op: setText, target: "## C", text: "### C"}
  refused: INVALID_ARGUMENT

- name: a body under a list item keeps its quoting
  before: |
    - a

        > one
    - b
  operations:
    - {op: setText, target: one, text: "two\n\nthree"}
  after: |
    - a
        > two
        >
        > three
    - b

- name: a body under a list item keeps a quote marker as its text
  before: |
    - a

      old
  operations:
    - {op: setText, target: old, text: "> quote"}
  after: |
    - a
      > > quote

- name: a body between headings changes as written
  before: |
    # A

    one

    # B
  operations:
    - {op: setText, target: one, text: "two *lines*\nhere"}
  after: |
    # A

    two *lines*
    here

    # B

- name: text that changes a body into an outline note is refused
  before: |
    # A

    one
  operations:
    - {op: setText, target: one, text: "- one"}
  refused: INVALID_ARGUMENT

- name: text that adds a note is refused
  before: |
    - a
  operations:
    - {op: setText, target: "- a", text: "- a\n- b"}
  refused: INVALID_ARGUMENT

- name: text that would read as an ID line is refused
  before: |
    - a
        - b
  operations:
    - {op: setText, target: "- b", text: "- id:: k3x9"}
  refused: INVALID_ARGUMENT

- name: text that would add an ID line is refused
  before: |
    - a
    - b
  operations:
    - {op: setText, target: "- a", text: "- a2\n    - id:: zz"}
  refused: INVALID_ARGUMENT

- name: emptying a body is refused
  before: |
    # A

    one
  operations:
    - {op: setText, target: one, text: ""}
  refused: INVALID_ARGUMENT

- name: text that differs only by a final line break is refused
  before: |
    - a
  operations:
    - {op: setText, target: "- a", text: "- a\n"}
  refused: INVALID_ARGUMENT

- name: a note on its parent's marker line changes, its parent taking a line of its own
  before: |
    - - b
  operations:
    - {op: setText, target: "- b", text: "- c"}
  after: |
    -
        - c

- name: unchanged text is refused
  before: |
    - a
  operations:
    - {op: setText, target: "- a", text: "- a"}
  refused: INVALID_ARGUMENT

- name: a note whose child starts on its line changes, its child taking a line of its own
  before: |
    - > quote
  operations:
    - {op: setText, target: "-", text: "- a"}
  after: |
    - a
        > quote

version: "1"
services:
- type: web
  name: remdo
  runtime: docker
  repo: https://github.com/remdo-project/remdo
  branch: main
  plan: starter
  region: frankfurt
  dockerContext: .
  dockerfilePath: ./docker/Dockerfile
  autoDeployTrigger: commit
  healthCheckPath: /health
  envVars:
    # Render injects the container's internal PORT. Do not pin it.
    # Django and Y-Sweet secrets are bootstrapped
    # onto the persistent disk on first run, so they are not set here.
    - key: DATA_DIR
      value: /data
    - key: APP_ORIGIN
      sync: false
  disk:
    name: remdo-data
    mountPath: /data
    sizeGB: 1

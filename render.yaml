version: "1"

projects:
- name: remdo
  environments:
  - name: production
    databases:
    - name: remdo-db
      plan: 0.1c-256mb
      region: frankfurt
    services:
    - type: web
      name: remdo
      runtime: docker
      plan: starter
      region: frankfurt
      branch: main
      dockerContext: .
      dockerfilePath: ./docker/Dockerfile
      # Render reads this as autoDeployTrigger: off. The string "off" cannot be
      # written here: quoting it fails yaml/plain-scalar, and unquoted it is a
      # YAML 1.1 boolean.
      autoDeploy: false
      healthCheckPath: /health
      maxShutdownDelaySeconds: 55
      numInstances: 1
      domains:
      - remdo.com
      envVars:
        # Render injects the container's internal PORT. Do not pin it.
        # Generated once when the service first receives these variables, then
        # reused by every later deploy.
        - key: AUTH_SECRET
          generateValue: true
        - key: COLLAB_INTERNAL_SECRET
          generateValue: true
        - key: DATABASE_URL
          fromDatabase:
            name: remdo-db
            property: connectionString
        - key: APP_ORIGIN
          value: https://remdo.com

  - name: staging
    databases:
    - name: remdo-staging-db
      plan: free
      region: frankfurt
    services:
    - type: web
      name: remdo-staging
      runtime: docker
      plan: starter
      region: frankfurt
      branch: main
      dockerContext: .
      dockerfilePath: ./docker/Dockerfile
      autoDeployTrigger: checksPass
      healthCheckPath: /health
      maxShutdownDelaySeconds: 55
      numInstances: 1
      domains:
      - staging.remdo.com
      envVars:
        # Staging keeps no disk, so the environment is the only secret source.
        - key: AUTH_SECRET
          generateValue: true
        - key: COLLAB_INTERNAL_SECRET
          generateValue: true
        - key: DATABASE_URL
          fromDatabase:
            name: remdo-staging-db
            property: connectionString
        - key: APP_ORIGIN
          value: https://staging.remdo.com

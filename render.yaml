version: "1"

projects:
- name: remdo
  environments:
  - name: production
    databases:
    - name: remdo-db
      plan: 0.1c-256mb
      region: frankfurt
    services:
    - type: web
      name: remdo
      runtime: docker
      plan: starter
      region: frankfurt
      branch: main
      dockerContext: .
      dockerfilePath: ./docker/Dockerfile
      # Render reads this as autoDeployTrigger: off. The string "off" cannot be
      # written here: quoting it fails yaml/plain-scalar, and unquoted it is a
      # YAML 1.1 boolean.
      autoDeploy: false
      healthCheckPath: /health
      numInstances: 1
      domains:
      - remdo.com
      envVars:
        # Render injects the container's internal PORT. Do not pin it.
        # Django and Y-Sweet secrets are bootstrapped
        # onto the persistent disk on first run, so they are not set here.
        - key: DATABASE_URL
          fromDatabase:
            name: remdo-db
            property: connectionString
        - key: APP_ORIGIN
          value: https://remdo.com
      disk:
        name: remdo-data
        mountPath: /data
        sizeGB: 1

  - name: staging
    databases:
    - name: remdo-staging-db
      plan: free
      region: frankfurt
    services:
    - type: web
      name: remdo-staging
      runtime: docker
      # A persistent disk requires a paid instance, so staging cannot run free.
      plan: starter
      region: frankfurt
      branch: main
      dockerContext: .
      dockerfilePath: ./docker/Dockerfile
      autoDeployTrigger: checksPass
      healthCheckPath: /health
      numInstances: 1
      domains:
      - staging.remdo.com
      envVars:
        - key: DATABASE_URL
          fromDatabase:
            name: remdo-staging-db
            property: connectionString
        - key: APP_ORIGIN
          value: https://staging.remdo.com
      disk:
        name: remdo-staging-data
        mountPath: /data
        sizeGB: 1

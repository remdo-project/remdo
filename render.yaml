version: "1"

projects:
- name: remdo
  environments:
  - name: production
    databases:
    - name: remdo-db
      plan: 0.1c-256mb
      region: frankfurt
    services:
    - type: web
      name: remdo
      runtime: docker
      plan: starter
      region: frankfurt
      branch: main
      dockerfilePath: ./docker/Dockerfile
      autoDeployTrigger: checksPass
      healthCheckPath: /health
      maxShutdownDelaySeconds: 55
      numInstances: 1
      domains:
      - remdo.com
      envVars:
        - key: AUTH_SECRET
          generateValue: true
        - key: COLLAB_INTERNAL_SECRET
          generateValue: true
        - key: REMDO_ADMIN_PASSWORD
          generateValue: true
        - key: DATABASE_URL
          fromDatabase:
            name: remdo-db
            property: connectionString
        - key: APP_ORIGIN
          value: https://remdo.com

  - name: test
    databases:
    - name: remdo-test-db
      plan: free
      region: frankfurt
    services:
    - type: web
      name: remdo-test
      runtime: docker
      plan: free
      region: frankfurt
      branch: deploy-test
      dockerfilePath: ./docker/Dockerfile
      autoDeployTrigger: commit
      healthCheckPath: /health
      maxShutdownDelaySeconds: 55
      numInstances: 1
      domains:
      - test.remdo.com
      envVars:
        - key: AUTH_SECRET
          generateValue: true
        - key: COLLAB_INTERNAL_SECRET
          generateValue: true
        - key: REMDO_ADMIN_PASSWORD
          generateValue: true
        - key: REMDO_USER_PASSWORD
          generateValue: true
        - key: DATABASE_URL
          fromDatabase:
            name: remdo-test-db
            property: connectionString
        - key: APP_ORIGIN
          value: https://test.remdo.com

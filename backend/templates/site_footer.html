<footer class="site-footer">
  <div class="site-footer-inner site-container">
    <div class="site-footer-start">
      <span>© {% now "Y" %} RemDo</span>
      <nav aria-label="Footer">
        <a href="/privacy/"{% if request.path == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
        <a href="/terms/"{% if request.path == '/terms/' %} aria-current="page"{% endif %}>Terms</a>
        {% if umami_website_id %}<button class="site-footer-link" type="button" data-analytics-settings>Privacy settings</button>{% endif %}
        <a href="https://github.com/remdo-project/remdo" target="_blank" rel="noreferrer">Source</a>
      </nav>
    </div>
    {% if slots %}<span class="remdo-slot" data-slot="footer-status"></span>{% endif %}
  </div>
</footer>

{% if umami_website_id %}
  <script>
    (() => {
      const redactUrl = (value) => {
        if (typeof value !== 'string' || value.length === 0) return value;
        try {
          const parsed = new URL(value, window.location.origin);
          parsed.search = '';
          parsed.hash = '';
          if (parsed.origin === window.location.origin && parsed.pathname.startsWith('/n/')) {
            parsed.pathname = '/n/:document';
          }
          return value.startsWith('/') && !value.startsWith('//') ? parsed.pathname : parsed.href;
        } catch {
          return value;
        }
      };

      window.remdoUmamiBeforeSend = (type, payload) => {
        if (window.remdoAnalyticsDisabled) return null;
        const signedIn = Boolean(window.remdoAnalyticsUserId);
        if (!signedIn && type === 'identify') return null;
        const next = { ...payload, url: redactUrl(payload.url), referrer: redactUrl(payload.referrer) };
        if (!signedIn) delete next.id;
        if (typeof next.url === 'string' && next.url.includes('/n/:document')) {
          next.title = 'Document · RemDo';
        }
        return next;
      };
    })();
  </script>
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="{{ umami_website_id }}"
    data-domains="{{ umami_domain }}"
    data-exclude-search="true"
    data-exclude-hash="true"
    data-do-not-track="true"
    data-before-send="remdoUmamiBeforeSend"
  ></script>
{% endif %}

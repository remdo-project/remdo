<footer class="remdo-footer">
  <div class="remdo-footer-links">
    <a href="https://github.com/remdo-project/remdo" target="_blank" rel="noreferrer">Source</a>
    {% if local_development %}
      <span>Local development</span>
    {% elif build_revision %}
      <span>Build <a href="https://github.com/remdo-project/remdo/commit/{{ build_revision }}" target="_blank" rel="noreferrer" title="{{ build_revision }}">#{{ build_revision|slice:":8" }}</a></span>
    {% else %}
      <span>Build unknown</span>
    {% endif %}
  </div>
</footer>

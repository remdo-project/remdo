{% if kind == 'collaborate' %}
<figure class="landing-artifact landing-artifact--collaborate" role="img" aria-label="Tom and Henry collaborate on a launch plan, with their cursors and selected text visible in the same outline.">
  <div class="landing-artifact-scene" aria-hidden="true">
    <img class="landing-artifact-background" src="/landing/collaborate.png" alt="">
    <div class="landing-artifact-window">
      <p class="landing-artifact-document">Atlas (launch)</p>
      <div class="landing-artifact-row landing-artifact-row--spaced">
        <div class="landing-artifact-note">
          <img class="landing-artifact-handle" src="/landing/note-handle.svg" alt="">

          <img class="landing-artifact-actions" src="/landing/note-actions.svg" alt="">

      <div class="landing-artifact-row landing-artifact-row--nested">
        <div class="landing-artifact-note">
          <img class="landing-artifact-handle" src="/landing/note-handle.svg" alt="">

          <p class="landing-artifact-text"><span class="landing-artifact-inline">Review the draft<span class="landing-artifact-peer landing-artifact-peer--tom"><span class="landing-artifact-peer-name">Tom</span></span></span></p>
          <img class="landing-artifact-actions" src="/landing/note-actions.svg" alt="">
        </div>
      </div>
      <div class="landing-artifact-row landing-artifact-row--nested">
        <div class="landing-artifact-note">
          <img class="landing-artifact-handle" src="/landing/note-handle.svg" alt="">

          <p class="landing-artifact-text">Send the <span class="landing-artifact-inline"><span class="landing-artifact-peer-selection"></span>final draft<span class="landing-artifact-peer landing-artifact-peer--henry"><span class="landing-artifact-peer-name">Henry</span></span></span> to Maya</p>

      <div class="landing-artifact-row">

      <div class="landing-artifact-row landing-artifact-row--nested">

          <img class="landing-artifact-handle" src="/landing/note-handle.svg" alt="">

          <img class="landing-artifact-actions" src="/landing/note-actions.svg" alt="">
        </div>
      </div>

  </div>

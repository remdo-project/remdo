[project]
name = "remdo-backend"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-allauth[headless,idp-oidc,socialaccount]>=65.19.4",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "httpx2>=2.13.1",
    "jsonschema>=4.26",
    "markdown>=3.11",
    "mcp>=2.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pyyaml>=6.0.3",
    "sentry-sdk>=2.70.0",
    "starlette>=1.8",
    "uvicorn>=0.54",
]

[tool.uv]
# Renovate's release-age hold skips lock-file maintenance, so uv enforces it.
exclude-newer = "3 days"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

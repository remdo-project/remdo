[project]
name = "remdo-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1.1",
    "django-allauth[headless]>=65.19.3",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

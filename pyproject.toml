[project]
name = "remdo-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-allauth[headless]>=65.19.3",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "markdown>=3.10.3",
    "psycopg[binary]>=3.3.5",
    "pyyaml>=6.0.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

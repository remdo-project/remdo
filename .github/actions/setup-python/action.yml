name: Setup backend
description: Configure Python and install locked backend dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version-file: .python-version
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: 0.12.15
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - run: uv sync --locked
      shell: bash

name: Docker Tests
permissions:
  contents: read

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-tests:
    permissions:
      contents: read
      actions: write
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_ENV"

      # The Docker E2E command installs Chromium into this cache itself.
      - name: Cache Playwright browsers (optional)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Run Docker E2E suite
        run: pnpm run test:e2e:docker

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          path: data/test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

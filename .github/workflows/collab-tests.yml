name: Collaboration Tests
permissions:
  contents: read

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collab-unit-tests:
    permissions:
      contents: read
      actions: write
    # Dependency setup can take over a minute; keep the test deadline in control.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm

      - name: Run collaboration unit tests
        run: TEST_TIMEOUT=$((60 * 7)) pnpm run test:collab

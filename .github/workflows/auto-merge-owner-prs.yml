name: Auto Merge Labeled PRs

on:
  issue_comment:
    types: [edited]

permissions:
  checks: read
  contents: write
  issues: read
  pull-requests: write
  statuses: read

jobs:
  auto-merge:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
      contains(github.event.comment.body, '<!-- codex-pull-request-review-summary -->') &&
      contains(github.event.comment.body, '✅ **Completed**')
    runs-on: ubuntu-latest

    steps:
      - name: Merge after clean Codex review and CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          test "$(jq -r .user.login <<<"$pr")" = "piotrlewalski" || exit 0
          test "$(jq -r .base.ref <<<"$pr")" = "main" || exit 0
          test "$(jq -r .head.repo.full_name <<<"$pr")" = "$GITHUB_REPOSITORY" || exit 0
          test "$(jq -r .draft <<<"$pr")" = "false" || exit 0
          jq -e 'any(.labels[]; .name == "auto-merge")' <<<"$pr" >/dev/null || exit 0

          head="$(jq -r .head.sha <<<"$pr")"
          short="${head:0:7}"
          body="$(jq -r .comment.body "$GITHUB_EVENT_PATH")"
          grep -Fq "`$short`" <<<"$body" || exit 0

          since="$(jq -r .comment.updated_at "$GITHUB_EVENT_PATH")"
          clean=false
          for _ in {1..12}; do
            if gh api -H "Accept: application/vnd.github+json"               "repos/$GITHUB_REPOSITORY/issues/$PR/reactions" --paginate               --jq ".[] | select(.user.login == \"chatgpt-codex-connector[bot]\" and .content == \"+1\" and .created_at >= \"$since\") | .id"               | grep -q .; then
              clean=true
              break
            fi
            sleep 5
          done
          $clean

          gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --watch --fail-fast

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          jq -e 'any(.labels[]; .name == "auto-merge")' <<<"$pr" >/dev/null || exit 0
          test "$(jq -r .head.sha <<<"$pr")" = "$head" || exit 0

          gh pr merge "$PR"             --repo "$GITHUB_REPOSITORY"             --merge             --match-head-commit "$head"

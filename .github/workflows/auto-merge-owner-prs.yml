name: Auto Merge Owner PRs

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: write
  statuses: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  monitor:
    if: >-
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == 'piotrlewalski' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Wait for CI and clean Codex review
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const STATUS_CONTEXT = 'Auto Merge Gate';
            const CODEX_LOGIN = 'chatgpt-codex-connector[bot]';
            const CODEX_MARKER = '<!-- codex-pull-request-review-summary -->';
            const REQUIRED_CI = new Set([
              'Collaboration Tests',
              'Docker Tests',
              'E2E Tests',
              'Lint',
              'Unit Tests',
            ]);
            const POLL_MS = 15_000;
            const CODEX_REACTION_GRACE_MS = 60_000;
            const DEADLINE = Date.now() + 25 * 60_000;

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const expectedHeadSha = context.payload.pull_request.head.sha;

            core.setOutput('ready', 'false');
            core.setOutput('pr-number', String(prNumber));
            core.setOutput('head-sha', expectedHeadSha);

            async function setStatus(state, description) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: expectedHeadSha,
                state,
                context: STATUS_CONTEXT,
                description,
              });
            }

            async function fail(description) {
              await setStatus('failure', description);
              core.setFailed(description);
            }

            await setStatus('pending', 'Waiting for CI and Codex review');

            while (Date.now() < DEADLINE) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });

              if (
                pr.state !== 'open' ||
                pr.draft ||
                pr.head.sha !== expectedHeadSha
              ) {
                core.info('PR changed while being monitored; this run will not merge it.');
                return;
              }

              const workflowRuns = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  head_sha: expectedHeadSha,
                  event: 'push',
                  per_page: 100,
                },
              );

              const latestByName = new Map();
              workflowRuns
                .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))
                .forEach((run) => {
                  if (REQUIRED_CI.has(run.name) && !latestByName.has(run.name)) {
                    latestByName.set(run.name, run);
                  }
                });

              const failedCi = [...latestByName.values()].filter(
                (run) => run.status === 'completed' && run.conclusion !== 'success',
              );
              if (failedCi.length > 0) {
                await fail(
                  `CI failed: ${failedCi.map((run) => run.name).join(', ')}`.slice(0, 140),
                );
                return;
              }

              const ciPassed =
                latestByName.size === REQUIRED_CI.size &&
                [...latestByName.values()].every(
                  (run) => run.status === 'completed' && run.conclusion === 'success',
                );

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });

              const summary = comments
                .filter(
                  (comment) =>
                    comment.user?.login === CODEX_LOGIN &&
                    comment.body?.includes(CODEX_MARKER),
                )
                .sort((left, right) => Date.parse(right.updated_at) - Date.parse(left.updated_at))[0];

              let codexPassed = false;
              let codexFailed = false;

              if (summary) {
                const shortSha = expectedHeadSha.slice(0, 7);
                const reviewRow = summary.body
                  .split('\n')
                  .find(
                    (line) =>
                      line.includes('**Code Review**') &&
                      line.includes(`\`${shortSha}\``),
                  );

                if (reviewRow?.includes('✅ **Completed**')) {
                  const completedAtMatch = reviewRow.match(/datetime="([^"]+)"/);
                  const completedAt = completedAtMatch ? Date.parse(completedAtMatch[1]) : 0;

                  const reactions = await github.paginate(github.rest.reactions.listForIssue, {
                    owner,
                    repo,
                    issue_number: prNumber,
                    per_page: 100,
                  });

                  codexPassed = reactions.some(
                    (reaction) =>
                      reaction.user?.login === CODEX_LOGIN &&
                      reaction.content === '+1' &&
                      Date.parse(reaction.created_at) >= completedAt - 5_000,
                  );

                  codexFailed =
                    !codexPassed &&
                    completedAt > 0 &&
                    Date.now() - completedAt >= CODEX_REACTION_GRACE_MS;
                }
              }

              if (codexFailed) {
                await fail('Codex completed without a clean-review reaction');
                return;
              }

              if (ciPassed && codexPassed) {
                await setStatus('pending', 'CI and Codex passed; enabling auto-merge');
                core.setOutput('ready', 'true');
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, POLL_MS));
            }

            await fail('Timed out waiting for CI and Codex review');

      - name: Enable native auto-merge
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
        run: >-
          gh pr merge "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --auto
          --merge
          --match-head-commit "$HEAD_SHA"

      - name: Mark auto-merge gate successful
        if: steps.gate.outputs.ready == 'true' && success()
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'Auto Merge Gate',
              description: 'CI and Codex passed; auto-merge enabled',
            });

      - name: Mark auto-merge gate failed
        if: steps.gate.outputs.ready == 'true' && failure()
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'Auto Merge Gate',
              description: 'CI and Codex passed, but enabling auto-merge failed',
            });

name: Lint
permissions:
  contents: read

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm run lint:dockerfile
      - run: pnpm run audit:policy
      - run: pnpm run audit:unused:prod
      - run: pnpm run lint
      - run: pnpm run check:dev-boundary
      - run: pnpm run api:check

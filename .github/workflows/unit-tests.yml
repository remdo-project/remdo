name: Unit Tests
permissions:
  contents: read

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
      actions: write
    name: Unit Tests
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - env:
          TEST_TIMEOUT: 360
        run: pnpm run test:unit --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  backend-tests:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: ./tools/check-backend.sh && ./tools/django.sh test
      - name: Verify PostgreSQL backend
        run: ./tools/postgres.sh run ./tools/django.sh test

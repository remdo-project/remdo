name: E2E Tests
permissions:
  contents: read

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers (optional)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright E2E suite
        env:
          TEST_TIMEOUT: 360
        run: pnpm run test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/e2e-runtime/test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

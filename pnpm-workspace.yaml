catalogMode: prefer

engineStrict: true

nodeVersion: 24.19.0

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - rollup@2.80.0
  - serialize-javascript@7.0.5
  - undici-types@6.21.0
  - semver@6.3.1

updateNotifier: false

updateConfig:
  ignoreDependencies:
    # TODO(deps): retry Kysely and remove its override; 0.29 breaks the Better Auth adapter.
    - kysely
    # TODO(deps): retry Lexical; 0.46 fails editor invariants.
    - '@lexical/*'
    - lexical
    # TODO(deps): retry TypeScript; version 7 is unsupported by @typescript-eslint.
    - typescript
    # TODO(deps): retry workbox-build; version 7.4.1 causes a provenance downgrade.
    - workbox-build

overrides:
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4 <8'
  '@eslint/config-array>minimatch': 3.1.5
  '@eslint/eslintrc>ajv': 6.14.0
  '@eslint/eslintrc>minimatch': 3.1.5
  '@typescript-eslint/typescript-estree>minimatch': 9.0.7
  body-parser: 2.2.1
  esbuild: '>=0.28.1'
  eslint>ajv: 6.14.0
  eslint>minimatch: 3.1.5
  express: '>=5.2.0'
  fast-uri: '>=4.1.2'
  glob>minimatch: 10.2.4
  js-yaml: 4.3.1
  kysely: 0.28.17
  markdown-it: '>=14.2.0'
  minimatch@10>brace-expansion: 5.0.9
  minimatch@3>brace-expansion: 1.1.18
  minimatch@5>brace-expansion: 2.1.4
  nanoid@3: '>=3.3.17 <4'
  postcss: '>=8.5.23'
  qs: 6.15.2
  serialize-javascript: 7.0.5
  table>ajv: 8.18.0
  undici: '>=7.29.0'

patchedDependencies:
  # Lexical V2 must ignore remote cursors mapped only to deleted text nodes.
  # Regression: tests/unit/collab/lexical-yjs-cursor-sync.collab.spec.ts.
  '@lexical/yjs@0.45.0': patches/@lexical__yjs@0.45.0.patch


  dayjs: ^1.11.21
  eslint: ^10.8.1
  eslint-plugin-compat: ^7.0.2
  eslint-plugin-react-refresh: ^0.5.3
  hono: ^4.12.34
  jiti: ^2.7.0
  jscpd: ^5.0.14
  jsdom: ^30.0.1
  knip: ^6.32.0
  kysely: 0.28.17
  lexical: ^0.45.0
  linkify-it: ^5.0.2

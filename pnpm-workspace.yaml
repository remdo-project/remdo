  '@babel/plugin-transform-modules-systemjs': '>=7.29.4 <8'
  '@eslint/config-array>minimatch': 3.1.5
  '@eslint/eslintrc>ajv': 6.14.0
  '@eslint/eslintrc>minimatch': 3.1.5
  '@typescript-eslint/typescript-estree>minimatch': 9.0.7
  body-parser: 2.2.1
  esbuild: '>=0.28.1'
  eslint>ajv: 6.14.0
  eslint>minimatch: 3.1.5
  express: '>=5.2.0'
  fast-uri: '>=4.1.2'
  glob>minimatch: 10.2.4
  js-yaml: 4.3.2
  markdown-it: '>=14.2.0'
  # TODO(deps): remove when markdownlint-cli2 stops pinning vulnerable smol-toml 1.7.0; verify with pnpm audit.
  markdownlint-cli2>smol-toml: 1.7.1
  minimatch@10>brace-expansion: 5.0.9
  minimatch@3>brace-expansion: 1.1.18
  minimatch@5>brace-expansion: 2.1.4
  nanoid@3: '>=3.3.17 <4'
  postcss: '>=8.5.23'
  qs: 6.15.2
  serialize-javascript: 7.0.5
  table>ajv: 8.18.0
  undici: '>=7.29.0'

packageExtensions:
  eslint-plugin-compat:
    dependencies:
      caniuse-lite: 1.0.30001810
patchedDependencies:
  # Lexical V2 must ignore remote cursors mapped only to deleted text nodes.
  # Regression: tests/unit/collab/lexical-yjs-cursor-sync.collab.spec.ts.
  '@lexical/yjs@0.49.0': patches/@lexical__yjs@0.49.0.patch
  # Cancel pending connections and close connecting sockets without Chromium warnings.
  # Upstream follow-up: docs/todo.md#upstream-reports.
  # Probe: remove patch; run tests/unit/provider-headless-lifecycle.spec.ts,
  # tests/unit/collab/provider-page-lifecycle.collab.spec.ts
  # and tests/e2e/app/collaboration-lifecycle.spec.ts.
  '@y-sweet/client@0.9.1': patches/@y-sweet__client@0.9.1.patch
  # Lexical must not warn when its own commit machinery dispatches a mutating
  # command: $updateDOMSelection sets the DOM selection during a commit, the
  # browser fires selectionchange, and Lexical dispatches
  # SELECTION_CHANGE_COMMAND while the committed state is still frozen. The
  # v0.49.0 warning (facebook/lexical#8863) targets application code
  # dispatching from editor.read() and does not exclude that internal path.
  # The guard spans the whole commit, so it also silences a mutation or update
  # listener dispatching a mutating command; revisit when upstream fixes this.
  # Regression: tests/e2e/editor/checklist.spec.ts structural-selection cases.
  lexical@0.49.0: patches/lexical@0.49.0.patch
allowBuilds:
  '@ast-grep/cli': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  y-sweet: true


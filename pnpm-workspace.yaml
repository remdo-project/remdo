catalogMode: prefer

# Renovate's release-age hold skips lock-file maintenance and updates applied outside its branches, so pnpm enforces it.
minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@boundaries/policies@1.1.0'
  - '@tabler/icons-react@3.53.0'
  - '@tabler/icons@3.53.0'
  - '@types/estree@1.0.11'
  - '@types/node@26.6.10'
  - '@types/react@19.3.3'
  - colord@2.14.1
  - electron-to-chromium@1.5.494
  - eslint-plugin-boundaries@7.4.5
  - eslint-plugin-jsdoc@65.5.5
  - eslint-plugin-n@18.6.0
  - fast-uri@4.2.4
  - hono@4.13.22
  - ignore@7.0.17
  - react-router-dom@7.18.7
  - react-router@7.18.7
  - tinyexec@1.4.0
  - tldts-core@7.6.0
  - tldts@7.6.0
trustPolicy: no-downgrade

trustPolicyExclude:
  - rollup@2.80.0

shellEmulator: true

strictDepBuilds: true

engineStrict: true

updateNotifier: false

overrides:
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4 <8'
  body-parser: 2.4.0
  esbuild: '>=0.28.1'
  eslint>ajv: 6.15.0
  express: '>=5.2.0'
  fast-uri: '>=4.1.2'
  js-yaml: 4.3.2
  markdown-it: '>=14.2.0'
  # TODO(deps): drop once micromark-extension-math accepts katex 0.18; katex 0.16 has no GHSA-238p-pmpm-9mq7 fix,
  # and markdownlint and @eslint/markdown use only its math syntax, which imports but never calls katex.
  # Probe: remove it, run pnpm install, and confirm every katex resolves to 0.18.2 or later.
  micromark-extension-math>katex: '>=0.18.2 <0.20'
  minimatch@5>brace-expansion: 2.1.8
  nanoid@3: '>=3.3.17 <4'
  postcss: '>=8.5.23'
  qs: 6.17.1
  serialize-javascript: 7.1.4
  undici: '>=7.29.0'
  # TODO(deps): drop once workbox-build accepts glob 14 (its update is held in renovate.json5); glob 11 has no
  # GHSA-3g3m-2fjr-6pw4 fix, and its one globSync call yields the same precache list on 14.
  # Probe: remove it, run pnpm install, and confirm every glob resolves to 14.0.2 or later.
  workbox-build>glob: '>=14.0.2 <15'

packageExtensions:
  eslint-plugin-compat:
    dependencies:
      caniuse-lite: 1.0.30001827
patchedDependencies:
  # Lexical V2 must ignore remote cursors mapped only to deleted text nodes.
  # Regression: tests/unit/collab/lexical-yjs-cursor-sync.collab.spec.ts.
  '@lexical/yjs@0.53.0': patches/@lexical__yjs@0.53.0.patch
allowBuilds:
  '@ast-grep/cli': true
  esbuild: true
  unrs-resolver: true


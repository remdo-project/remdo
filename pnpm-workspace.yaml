catalogMode: prefer

minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

trustPolicyExclude:
  - rollup@2.80.0
  - serialize-javascript@7.0.5
  - semver@6.3.1

shellEmulator: true

strictDepBuilds: true

nodeVersion: 24.21.0

engineStrict: true

updateNotifier: false

# TODO(deps): retry the package.json packageManager pin past pnpm 11.27.0; 11.27.1 and 12.6.0 hang Playwright
# mid-run and leak its web servers, likely via the pnpm exec signal change (pnpm#7374).
# Probe: corepack use pnpm@latest && pnpm run test:e2e tests/e2e/editor/links.spec.ts.
updateConfig:
  ignoreDependencies:
    # TODO(deps): retry TypeScript; version 7 is unsupported by @typescript-eslint.
    - typescript
    # TODO(deps): retry workbox-build; version 7.4.1 causes a provenance downgrade.
    - workbox-build

overrides:
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4 <8'
  '@eslint/config-array>minimatch': 3.1.5
  '@eslint/eslintrc>ajv': 6.14.0
  '@eslint/eslintrc>minimatch': 3.1.5
  '@typescript-eslint/typescript-estree>minimatch': 9.0.7
  body-parser: 2.2.1
  esbuild: '>=0.28.1'
  eslint>ajv: 6.14.0
  eslint>minimatch: 3.1.5
  express: '>=5.2.0'
  fast-uri: '>=4.1.2'
  glob>minimatch: 10.2.4
  js-yaml: 4.3.2
  markdown-it: '>=14.2.0'
  minimatch@10>brace-expansion: 5.0.9
  minimatch@3>brace-expansion: 1.1.18
  minimatch@5>brace-expansion: 2.1.4
  nanoid@3: '>=3.3.17 <4'
  postcss: '>=8.5.23'
  qs: 6.15.2
  serialize-javascript: 7.0.5
  table>ajv: 8.18.0
  undici: '>=7.29.0'

packageExtensions:
  eslint-plugin-compat:
    dependencies:
      caniuse-lite: 1.0.30001810
patchedDependencies:
  # Lexical V2 must ignore remote cursors mapped only to deleted text nodes.
  # Regression: tests/unit/collab/lexical-yjs-cursor-sync.collab.spec.ts.
  '@lexical/yjs@0.51.0': patches/@lexical__yjs@0.51.0.patch
  # Lexical must not warn when its own commit machinery dispatches a mutating
  # command: $updateDOMSelection sets the DOM selection during a commit, the
  # browser fires selectionchange, and Lexical dispatches
  # SELECTION_CHANGE_COMMAND while the committed state is still frozen. The
  # v0.49.0 warning (facebook/lexical#8863) targets application code
  # dispatching from editor.read() and does not exclude that internal path.
  # The patch applies the fix from facebook/lexical#9230, which still warns
  # inside an explicit editor.read().
  # Regression: tests/e2e/editor/checklist.spec.ts structural-selection cases.
  # TODO(deps): drop this patch on the first Lexical release containing
  # facebook/lexical@c23a367. Probe: remove it and run the regression above.
  lexical@0.51.0: patches/lexical@0.51.0.patch
allowBuilds:
  '@ast-grep/cli': true
  esbuild: true
  unrs-resolver: true

